name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.notEqual(pkg.private, true, 'Package must be publishable');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/, 'Release version must be stable semver');
          if (process.env.RELEASE_REF.startsWith('refs/tags/')) {
            assert.equal(process.env.RELEASE_REF, `refs/tags/v${pkg.version}`, 'Tag must match package.json');
          }
          JS
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Pack release
        run: npm pack
      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish ./*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
